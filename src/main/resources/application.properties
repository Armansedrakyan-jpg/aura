spring.application.name=auraclone

# Gemini AI
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# JWT (minimum 32 bytes / characters)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Firebase Realtime Database
firebase.enabled=${FIREBASE_ENABLED:true}
firebase.database-url=${FIREBASE_DATABASE_URL:https://aura-24ae8-default-rtdb.europe-west1.firebasedatabase.app/}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# App settings
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.aura.cooldown-hours=${AURA_COOLDOWN_HOURS:12}

# Google Play Billing
google.play.package-name=${GOOGLE_PLAY_PACKAGE_NAME:com.example.auraclone}
google.play.verification-stub=${GOOGLE_PLAY_VERIFICATION_STUB:true}

