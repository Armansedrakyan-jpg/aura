# Test configuration using in-memory H2 in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:auratest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

gemini.api.key=test-gemini-key
gemini.model=gemini-2.5-flash

jwt.secret=test-jwt-secret-key-at-least-32-characters-long
jwt.expiration-ms=3600000

firebase.enabled=false
app.rate-limit.enabled=false
